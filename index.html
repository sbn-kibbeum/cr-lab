<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>크리에이터 랩 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 좌측 내비 + 우측 작업 화면의 SaaS 앱 셸. 상단 바에서 보기 역할(수강생·코칭진·관리자)을 바꿔 같은 데이터를 다른 시점으로 본다. */
:root{
  --bg:#F7F5F6; --surface:#FFFFFF; --surface-2:#F2EEF0; --line:#E6DFE3;
  --ink:#16121A; --ink-2:#4D4552; --ink-3:#857B8A;
  --accent:#FF1F7A; --accent-soft:#FFE4EF; --accent-ink:#FFFFFF;
  --ex:#0E9F6E; --gr:#1C8FB0; --gd:#C98A0B; --bd:#E06A1B; --wo:#B42318;
  --ex-s:#E2F6EE; --gr-s:#E2F2F7; --gd-s:#FBF1DC; --bd-s:#FCEBDD; --wo-s:#FBE3E7;
  --kakao:#FEE500; --kakao-ink:#191600;
  --f-display:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-mono:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0B10; --surface:#18141B; --surface-2:#221C25; --line:#322A36;
  --ink:#F5EFF3; --ink-2:#C2B6BE; --ink-3:#8E8292;
  --accent:#FF3D8B; --accent-soft:#3A1527; --accent-ink:#FFFFFF;
  --ex:#3CCB95; --gr:#4DB6D6; --gd:#E7B547; --bd:#F18A45; --wo:#F06A7D;
  --ex-s:#123227; --gr-s:#122C35; --gd-s:#33280F; --bd-s:#3A2414; --wo-s:#3A1820;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0B10; --surface:#18141B; --surface-2:#221C25; --line:#322A36;
  --ink:#F5EFF3; --ink-2:#C2B6BE; --ink-3:#8E8292;
  --accent:#FF3D8B; --accent-soft:#3A1527; --accent-ink:#FFFFFF;
  --ex:#3CCB95; --gr:#4DB6D6; --gd:#E7B547; --bd:#F18A45; --wo:#F06A7D;
  --ex-s:#123227; --gr-s:#122C35; --gd-s:#33280F; --bd-s:#3A2414; --wo-s:#3A1820;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.02em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:700;font-size:16px}
.brand small{font-weight:500;color:var(--ink-3);font-size:12px}
.sample-tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--gd-s);color:var(--gd);font-weight:600;letter-spacing:.02em}
.spacer{flex:1}
.role{display:flex;background:var(--surface-2);border-radius:99px;padding:3px;gap:2px}
.role button{border:0;background:transparent;padding:5px 12px;border-radius:99px;font-size:12.5px;color:var(--ink-2)}
.role button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100% - 56px)}
nav.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
nav.side .grp{font-size:11px;color:var(--ink-3);letter-spacing:.06em;padding:12px 10px 4px}
nav.side button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-size:13.5px}
nav.side button:hover{background:var(--surface-2)}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side .badge{margin-left:auto;background:var(--wo);color:#fff;font-size:11px;border-radius:99px;padding:0 7px;line-height:18px}
nav.side .ico{width:18px;text-align:center;font-family:var(--f-mono);font-size:12px;opacity:.8}
.quota{margin-top:auto;padding:12px 10px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);display:grid;gap:6px}
.quota b{color:var(--ink);font-weight:600}
.bar{height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

main{padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.view{max-width:1080px;margin:0 auto;display:grid;gap:20px}
.vh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vh h1{font-size:22px}
.vh p{margin:4px 0 0;color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:15px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;font-size:13px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
textarea{min-height:96px;resize:vertical}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:99px;font-family:var(--f-display)}
.g-EXCELLENT{background:var(--ex-s);color:var(--ex)} .g-GREAT{background:var(--gr-s);color:var(--gr)}
.g-GOOD{background:var(--gd-s);color:var(--gd)} .g-BAD{background:var(--bd-s);color:var(--bd)} .g-WORST{background:var(--wo-s);color:var(--wo)}
.c-EXCELLENT{color:var(--ex)} .c-GREAT{color:var(--gr)} .c-GOOD{color:var(--gd)} .c-BAD{color:var(--bd)} .c-WORST{color:var(--wo)}

/* 내 채널 */
.hero-grade{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .v b{font-family:var(--f-display);font-size:32px;line-height:1}
.ring .v span{font-size:11px;color:var(--ink-3)}
.ladder{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.ladder span{flex:1;min-width:52px;text-align:center;font-size:10.5px;font-weight:700;padding:5px 0;border-radius:6px;background:var(--surface-2);color:var(--ink-3);letter-spacing:.03em}
.ladder span.on{color:#fff}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:22px}
.stat span{font-size:12px;color:var(--ink-3)}
.spark{width:100%;height:56px;display:block}

table.list{width:100%;border-collapse:collapse}
table.list th{font-size:11.5px;color:var(--ink-3);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.list td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--surface-2)}
.tw{overflow-x:auto}
.dot{width:8px;height:8px;border-radius:50%;background:var(--wo);display:inline-block}

/* 진단 */
.items{display:grid;gap:10px}
.item{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:12px;align-items:center}
.item .lab{font-size:13px;font-weight:500}
.item .tr{height:10px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.item .tr i{display:block;height:100%;border-radius:9px;transition:width .6s ease}
.item .sc{font-family:var(--f-mono);font-size:12.5px;text-align:right;color:var(--ink-2)}
.verdict{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-weight:500}
.fix{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;flex-wrap:wrap}
.fix .k{font-size:11px;color:var(--ink-3)}
.lec{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:6px;padding:4px 9px;font-size:12.5px;font-weight:600;border:0}
.lec:hover{background:var(--accent-soft);color:var(--accent)}
.comment{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;background:var(--surface)}
.comment.new{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-content:center;font-weight:700;font-size:12px;color:#fff;background:var(--accent)}
.av.ai{background:var(--ink-3)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;display:grid;gap:10px}
.progress{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s linear}
.steps{display:grid;gap:4px;font-size:12.5px;color:var(--ink-3)}
.steps .done{color:var(--ink)}

/* 코칭 콘솔 */
.queue{display:grid;gap:8px}
.q{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;text-align:left;background:var(--surface)}
.q[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.console{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}
.kakao{background:var(--surface-2);border-radius:12px;padding:12px;display:grid;gap:6px;font-size:12.5px}
.kakao .hd{background:var(--kakao);color:var(--kakao-ink);font-weight:700;border-radius:8px 8px 0 0;padding:6px 10px;margin:-12px -12px 4px}

/* 레터 */
.letter{display:grid;gap:14px}
.kw{display:grid;gap:6px}
.kw div{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.kw b{font-family:var(--f-mono)}
.up{color:var(--ex);font-family:var(--f-mono);font-size:12px}
.lock{display:grid;place-items:center;gap:10px;text-align:center;padding:40px 16px;border:1px dashed var(--line);border-radius:10px}

/* 레퍼런스 */
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.ref{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);display:grid}
.thumb{aspect-ratio:16/9;max-width:100%;display:grid;place-content:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:#fff;padding:12px;text-align:center}
.ref .b{padding:10px 12px;display:grid;gap:4px}
.mult{font-family:var(--f-mono);font-weight:500;color:var(--ex)}

/* 도구 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 12px;border-bottom:2px solid transparent;color:var(--ink-2);font-weight:500}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
.out{background:var(--surface-2);border-radius:8px;padding:14px;white-space:pre-wrap;font-size:13px;line-height:1.7;min-height:160px}
ol.opts{margin:0;padding-left:20px;display:grid;gap:4px}

/* 수익화 */
.range{font-family:var(--f-display);font-size:26px;font-weight:700}
.chk{display:grid;gap:6px}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--surface-2);cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent)}

.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;max-width:340px;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateY(20px);opacity:0;transition:.25s;pointer-events:none}
.toast.on{transform:none;opacity:1}
.empty{padding:24px;text-align:center;color:var(--ink-3)}
.mnav{display:none}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{display:none}
  .mnav{display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin:-8px 0 0}
  .mnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:12.5px;white-space:nowrap}
  .mnav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .grid2,.grid3,.console{grid-template-columns:minmax(0,1fr)}
  .hero-grade{grid-template-columns:minmax(0,1fr);justify-items:start}
  .item{grid-template-columns:76px minmax(0,1fr) 54px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="brand"><span style="color:var(--accent);font-weight:900;letter-spacing:-.02em">AFTER7</span> 크리에이터 랩 <small>시그니처</small></div>
  <span class="sample-tag">샘플 데이터 · 가안</span>
  <div class="spacer"></div>
  <div class="role" role="group" aria-label="보기 역할">
    <button type="button" data-role="student" aria-pressed="true">수강생</button>
    <button type="button" data-role="coach" aria-pressed="false">코칭진(필성님)</button>
    <button type="button" data-role="admin" aria-pressed="false">관리자</button>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="메뉴"></nav>
  <main>
    <div class="mnav" id="mnav" aria-label="메뉴"></div>
    <div id="app"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const LEC={click:{n:37,t:'썸네일이 클릭을 만든다'},demand:{n:23,t:'트렌드 키워드 찾는 법'},react:{n:15,t:'8분 대본 구조'},immerse:{n:44,t:'인트로 3초 편집'},sub:{n:12,t:'터진 영상 구조로 기획하기'},title:{n:38,t:'제목 A/B 테스트'},money:{n:52,t:'광고 단가와 협찬'},risk:{n:55,t:'나락 방지 체크리스트'}};
const ITEMS=[{k:'click',l:'① 클릭',max:30,d:'24시간 조회 · 내 평균 대비'},{k:'demand',l:'② 주제 수요',max:30,d:'같은 키워드 동급 영상 대비'},{k:'react',l:'③ 반응',max:20,d:'참여율 동급 대비'},{k:'immerse',l:'④ 몰입',max:10,d:'히트맵 강한 · 약한 구간'},{k:'sub',l:'⑤ 구독 연결',max:10,d:'게시 후 3일 구독 증감'}];
const GRADES=[['EXCELLENT',85,'var(--ex)'],['GREAT',70,'var(--gr)'],['GOOD',50,'var(--gd)'],['BAD',30,'var(--bd)'],['WORST',0,'var(--wo)']];
const grade=s=>GRADES.find(g=>s>=g[1])[0];
const gcolor=g=>GRADES.find(x=>x[0]===g)[2];
const needsCoach=g=>g==='BAD'||g==='WORST'||g==='EXCELLENT';

const S={
  role:'student', view:'channel', sel:'v2', member:true, quota:7, coachSel:null,
  tool:'plan', toolTopic:'편의점 신상 리뷰', toolOut:null, toolLen:'8분', myCat:'푸드', trendCat:'전체', trendMine:false, trendPeriod:'week', letterSel:'L1',
  checks:{biz:true,ad:false,tax:false,contract:false,copyright:true},
  money:{subs:2340,views:3800},
  videos:[
    {id:'v4',title:'새벽 브이로그 | 혼밥',date:'11/10',views:612,s:{click:5,demand:8,react:6,immerse:3,sub:2},comments:[],unread:false},
    {id:'v2',title:'편의점 신상 다 먹어봄 (솔직후기)',date:'11/07',views:1480,s:{click:9,demand:14,react:10,immerse:4,sub:3},comments:[],unread:false},
    {id:'v3',title:'냉장고 파먹기 일주일 챌린지 DAY1',date:'11/03',views:9820,s:{click:28,demand:27,react:18,immerse:9,sub:8},comments:[{by:'필성님',role:'coach',text:'썸네일에 "DAY1" 숫자를 크게 넣은 게 클릭을 끌어올렸어요. 시리즈 2편도 같은 틀을 유지하고, 첫 3초에 냉장고를 여는 장면을 바로 보여 주세요.',lec:'sub',at:'11/04 10:12'}],unread:false},
    {id:'v1',title:'자취 10년차가 알려주는 3천원 김치볶음밥',date:'10/29',views:6110,s:{click:26,demand:24,react:15,immerse:8,sub:7},comments:[],unread:false},
  ],
  letters:[
    {id:'L1',date:'11/10 (월)',title:'11월 2주차 · 푸드 카테고리',kw:[['편의점 신상 리뷰','+182%'],['3천원 레시피','+96%'],['냉장고 파먹기','+71%'],['혼밥 브이로그','+44%'],['에어프라이어 야식','+38%']],format:'"전부 다 먹어봄" 랭킹형 · 1분 안에 최종 1위 공개',word:'이번 주는 "솔직후기"보다 "순위"가 이깁니다. 결론을 썸네일에 먼저 쓰세요.'},
    {id:'L2',date:'11/03 (월)',title:'11월 1주차 · 푸드 카테고리',kw:[['수능 간식','+210%'],['다이소 주방템','+88%'],['밀프렙','+52%'],['라면 꿀조합','+41%'],['자취 요리','+30%']],format:'"OO원으로 일주일" 챌린지 · 회차형 시리즈',word:'시리즈는 1편보다 2편 썸네일이 더 중요합니다.'},
  ],
};
const total=v=>Object.values(v.s).reduce((a,b)=>a+b,0);
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){const t=$('#toast');t.innerHTML=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3200)}
const pendingCount=()=>S.videos.filter(v=>needsCoach(grade(total(v)))&&!v.comments.length).length;
const unreadCount=()=>S.videos.filter(v=>v.unread).length;

const MENUS={

    m.map(([k,i,l])=>`<button type="button" data-go="${k}" ${S.view===k?'aria-current="page"':''}><span class="ico">${i}</span>${l}${badge(k)}</button>`).join('')+
    (S.role==='student'?`<div class="quota"><div>영상 · 채널 찾기 <b class="num">${S.quota}</b>/10 남음 (오늘)</div><div class="bar"><i style="width:${S.quota*10}%"></i></div><div>수강 기간 · 내 채널 진단 무제한</div></div>`:
     `<div class="quota"><div>${S.role==='coach'?'담당 수강생만 표시됩니다':'전체 수강생 · 레터 발행 권한'}</div></div>`);

/* ---------- 내 채널 ---------- */

  const avg=Math.round(vs.reduce((a,v)=>a+total(v),0)/vs.length);
  const g=grade(avg), C=2*Math.PI*56, off=C*(1-avg/100);
  const pts=[...vs].reverse().map(total), w=300,h=56, xs=i=>10+i*(w-20)/(pts.length-1), ys=v=>h-6-(v/100)*(h-12);

  <div class="grid2">

      <div class="v"><b class="num">${avg}</b><span>최근 4개 평균</span></div></div>
      <div><span class="pill g-${g}">${g}</span>
        <p style="margin:8px 0 0">최근 영상 4개 중 <b>${vs.filter(v=>['BAD','WORST'].includes(grade(total(v)))).length}개</b>가 막혀 있어요. 가장 약한 항목은 <b>① 클릭</b>입니다.</p>
        <div class="ladder">${GRADES.map(x=>`<span class="${x[0]===g?'on':''}" style="${x[0]===g?`background:${x[2]}`:''}">${x[0]}</span>`).join('')}</div></div>
    </section>
    <section class="panel">
      <h2>점수 흐름</h2>
      <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="최근 영상 점수 추이">
        <line x1="0" x2="${w}" y1="${ys(50)}" y2="${ys(50)}" stroke="var(--line)" stroke-dasharray="3 3"/>
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
        ${pts.map((v,i)=>`<circle cx="${xs(i)}" cy="${ys(v)}" r="${i===pts.length-1?4:2.5}" fill="${gcolor(grade(v))}"/>`).join('')}

        <div class="stat"><b class="num">${vs.filter(v=>grade(total(v))==='EXCELLENT').length}/3</b><span>EXCELLENT 누적 · 나노 계약 후보</span></div>
      </div>
    </section>
  </div>
  <section class="panel"><h2>영상별 진단</h2><div class="tw"><table class="list">
    <thead><tr><th>영상</th><th>게시</th><th>조회수</th><th>점수</th><th>등급</th><th>코칭</th></tr></thead>
    <tbody>${vs.map(v=>{const t=total(v),gg=grade(t);return `<tr class="click" data-open="${v.id}"><td>${v.unread?'<span class="dot" title="새 코멘트"></span> ':''}${esc(v.title)}</td><td class="num muted">${v.date}</td><td class="num">${v.views.toLocaleString()}</td><td class="num"><b>${t}</b></td><td><span class="pill g-${gg}">${gg}</span></td><td class="small">${v.comments.length?'<span class="c-EXCELLENT">코멘트 도착</span>':needsCoach(gg)?'<span class="muted">코칭진 확인 중</span>':'<span class="muted">AI 진단</span>'}</td></tr>`}).join('')}</tbody></table></div></section>
  </div>`;

/* ---------- 영상 진단 ---------- */
function weakest(v){return ITEMS.map(i=>({...i,r:v.s[i.k]/i.max})).sort((a,b)=>a.r-b.r)[0]}
function aiText(v){const t=total(v),g=grade(t),w=weakest(v);
  if(g==='EXCELLENT')return `5개 항목이 모두 동급 기준선 위입니다. 같은 구조로 다음 편을 만드세요.`;
  if(g==='GREAT')return `잘 됐어요. ${w.l.slice(2)}만 동급 평균에 조금 못 미칩니다. 지금 구조는 유지하세요.`;
  if(g==='GOOD')return `무난합니다. 한 가지만 고치면 GREAT로 올라갑니다: ${w.l.slice(2)}.`;
  return `${w.l.slice(2)}에서 막혔어요. 동급 영상의 ${Math.round(w.r*100)}% 수준입니다.`}
function vDiag(){
  const v=S.videos.find(x=>x.id===S.sel)||S.videos[0];
  if(S.role==='student'&&v.unread){v.unread=false;setTimeout(renderNav)}
  const t=total(v),g=grade(t),w=weakest(v);
  const list=S.videos.map(x=>`<option value="${x.id}" ${x.id===v.id?'selected':''}>${esc(x.title)}</option>`).join('');
  return `<div class="view">
  <div class="vh"><div><h1>영상 진단</h1><p>영상을 올리면 5개 항목 100점으로 진단하고, 막힌 곳은 강의 회차로 바로 연결합니다.</p></div></div>
  <div class="grid2">
  <section class="panel" style="display:grid;gap:14px">
    <label class="f">진단할 영상<select id="selv">${list}</select></label>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div><div class="muted small">총점</div><div style="font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1" class="num c-${g}">${t}</div></div>
      <span class="pill g-${g}" style="font-size:13px;padding:5px 12px">${g}</span>
      <div class="muted small">게시 ${v.date} · 조회 <span class="num">${v.views.toLocaleString()}</span></div>
    </div>
    <div class="verdict">${aiText(v)}</div>
    <div class="items">${ITEMS.map(i=>{const r=v.s[i.k]/i.max;const c=r>=.8?'var(--ex)':r>=.6?'var(--gr)':r>=.45?'var(--gd)':r>=.3?'var(--bd)':'var(--wo)';return `<div class="item"><div class="lab">${i.l}</div><div><div class="tr"><i style="width:${r*100}%;background:${c}"></i></div><div class="muted" style="font-size:11px;margin-top:2px">${i.d}</div></div><div class="sc">${v.s[i.k]} / ${i.max}</div></div>`}).join('')}</div>
    ${['BAD','WORST','GOOD'].includes(g)?`<div class="fix"><span class="k">문제 해결 바로가기</span><button type="button" class="lec" data-lec="${w.k}">${LEC[w.k].n}강 · ${LEC[w.k].t}</button></div>`:''}
  </section>
  <section class="panel" style="display:grid;gap:12px;align-content:start">
    <h2 style="margin:0">코칭</h2>
    ${v.comments.length?v.comments.map((c,ix)=>`<div class="comment ${c.fresh?'new':''}"><div class="who"><span class="av">${c.by[0]}</span><b>${esc(c.by)}</b><span class="muted">${c.role==='coach'?'코칭진 · 강사':'코칭진 · 운영'} · ${c.at}</span></div><div>${esc(c.text)}</div>${c.lec?`<div><button type="button" class="lec" data-lec="${c.lec}">${LEC[c.lec].n}강 · ${LEC[c.lec].t}</button></div>`:''}</div>`).join(''):
      needsCoach(g)?`<div class="comment"><div class="who"><span class="av ai">·</span><b>코칭진 확인 중</b></div><div class="muted">${g==='EXCELLENT'?'잘 된 영상은 코칭진이 칭찬 코멘트를 남겨 드려요.':'BAD · WORST 영상은 코칭진이 직접 코멘트를 남깁니다. 등록되면 알림톡으로 알려 드려요.'}</div></div>`:
      `<div class="comment"><div class="who"><span class="av ai">AI</span><b>AI 진단</b><span class="muted">GREAT · GOOD 등급은 AI가 바로 답합니다</span></div><div>${aiText(v)}</div></div>`}
    ${g==='WORST'&&S.videos.filter(x=>grade(total(x))==='WORST').length>=1?`<p class="muted small" style="margin:0">WORST 3회 누적 시 1:1 코칭이 열립니다. 현재 <b class="num">${S.videos.filter(x=>grade(total(x))==='WORST').length}</b>/3</p>`:''}
    ${S.role==='student'?`<div class="drop"><b>새 영상 진단하기</b><label class="f">영상 제목<input type="text" id="nt" placeholder="예: 다이소 주방템 10개 써봄"></label><label class="f">유튜브 링크<input type="text" id="nu" placeholder="https://youtu.be/..."></label><button type="button" class="btn pri" id="go">진단 시작</button><div id="prog" hidden><div class="progress"><i id="pbar"></i></div><div class="steps" id="psteps"></div></div></div>`:''}
  </section></div></div>`;
}
function hashScore(str){let h=7;for(const c of str)h=(h*31+c.charCodeAt(0))>>>0;
  const r=k=>((h>>>(k*3))%100)/100;let boost=/[0-9]/.test(str)?.12:0;if(/챌린지|순위|전부|다 먹|써봄/.test(str))boost+=.15;
  return {click:Math.round(30*Math.min(1,.25+r(1)*.6+boost)),demand:Math.round(30*Math.min(1,.3+r(2)*.55+boost)),react:Math.round(20*Math.min(1,.3+r(3)*.6)),immerse:Math.round(10*Math.min(1,.3+r(4)*.6)),sub:Math.round(10*Math.min(1,.2+r(5)*.6))}}
function runDiag(){
  const title=$('#nt').value.trim();if(!title){toast('영상 제목을 먼저 입력해 주세요.');$('#nt').focus();return}
  const steps=['채널 연결 확인','24시간 조회 · 내 평균 비교','같은 키워드 동급 영상 비교','참여율 · 히트맵 분석','CMS 구독 증감 확인'];
  $('#prog').hidden=false;$('#go').disabled=true;let i=0;
  const tick=()=>{$('#pbar').style.width=((i)/steps.length*100)+'%';$('#psteps').innerHTML=steps.map((s,ix)=>`<div class="${ix<i?'done':''}">${ix<i?'✓':'·'} ${s}</div>`).join('');
    if(i<=steps.length-1){i++;setTimeout(tick,420)}else{setTimeout(()=>{
      const id='v'+Date.now();const v={id,title,date:'11/12',views:0,s:hashScore(title),comments:[],unread:false};
      S.videos.unshift(v);S.sel=id;const g=grade(total(v));
      toast(`진단 완료 · <b>${g}</b> ${total(v)}점${needsCoach(g)?'<br>코칭진에게 코멘트 요청이 들어갔어요.':''}`);render()},450)}};
  tick();
}

    </section>
  </div></div>`;
}
function sendComment(){

  const done=C.filter(c=>S.checks[c[0]]).length;
  return `<div class="view">
  <div class="vh"><div><h1>수익화 · 리스크</h1><p>적정 광고 단가를 가늠하고, 세무 · 법무 · 저작권 사고를 미리 막습니다.</p></div></div>
  <div class="grid2">
    <section class="panel" style="display:grid;gap:12px"><h2 style="margin:0">적정 광고 단가 (가안)</h2>
      <div class="grid2"><label class="f">구독자 수<input type="number" id="ms" value="${subs}" min="0"></label><label class="f">최근 평균 조회수<input type="number" id="mv" value="${views}" min="0"></label></div>
      <div><div class="muted small">브랜디드 1건 제안 범위</div><div class="range num">${lo.toLocaleString()} ~ ${hi.toLocaleString()}원</div></div>
      <p class="muted small" style="margin:0">평균 조회수 × 15~30원 기준 가안입니다. 재무 · 법무 검토 후 확정합니다. 연계 강의: 52강</p>
      <button type="button" class="btn" data-lec="money">협찬 답장 프롬프트 열기</button></section>
    <section class="panel" style="display:grid;gap:12px"><h2 style="margin:0">나락 방지 체크 <span class="muted num">${done}/${C.length}</span></h2>
      <div class="bar"><i style="width:${done/C.length*100}%;background:${done===C.length?'var(--ex)':'var(--gd)'}"></i></div>
      <div class="chk">${C.map(c=>`<label><input type="checkbox" data-chk="${c[0]}" ${S.checks[c[0]]?'checked':''}><span>${c[1]}</span></label>`).join('')}</div>
      <p class="muted small" style="margin:0">일반 가이드입니다. 개별 자문은 유관부서 월 1회 답변으로 연결합니다. 연계 강의: 55강</p></section>
  </div></div>`;
}

function render(){
  renderNav();
  const V={channel:vChannel,diag:vDiag,console:vConsole,letter:vLetter,ref:vRef,tool:vTool,money:vMoney,trend:vTrend}[S.view];
  $('#app').innerHTML=V();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,tr[data-open]');if(!b)return;
  if(b.dataset.role){S.role=b.dataset.role;document.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed',x===b));S.view=MENUS[S.role][0][0];render();return}
  if(b.dataset.go){S.view=b.dataset.go;render();window.scrollTo(0,0);return}
  if(b.dataset.open){S.sel=b.dataset.open;S.view='diag';render();return}
  if(b.dataset.lec){const l=LEC[b.dataset.lec];toast(`애프터7 강의실로 이동합니다<br><b>${l.n}강 · ${l.t}</b> <span style="opacity:.7">(데모)</span>`);return}
  if(b.dataset.q){S.coachSel=b.dataset.q;render();return}
  if(b.dataset.letter){S.letterSel=b.dataset.letter;render();return}
  if(b.dataset.tool){S.tool=b.dataset.tool;render();return}
  if(b.dataset.period){S.trendPeriod=b.dataset.period;render();return}
  if(b.dataset.tcat){S.trendCat=b.dataset.tcat;render();return}
  if(b.dataset.plan){S.toolTopic=b.dataset.plan;S.myCat=b.dataset.plancat;S.tool='plan';S.view='tool';render();window.scrollTo(0,0);toast('이 주제로 기획 프롬프트를 만들었어요.');return}
  switch(b.id){
    case 'go':runDiag();break;
    case 'csend':sendComment();break;
    case 'lpub':publishLetter();break;
    case 'memback':S.member=true;render();break;
    case 'refsearch':if(S.quota>0){S.quota--;REFS.push(REFS.shift());toast(`새 레퍼런스를 찾았어요. 오늘 남은 횟수 ${S.quota}회`);render()}break;
    case 'tgen':S.toolTopic=$('#tt').value.trim()||S.toolTopic;render();toast('프롬프트를 만들었어요. 복사해서 쓰세요.');break;
    case 'tcopy':{const txt=S.toolOut;const fb=()=>{const r=document.createRange();r.selectNodeContents($('#tout'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('텍스트를 선택했어요. Ctrl+C로 복사하세요.')};
      try{navigator.clipboard.writeText(txt).then(()=>toast('복사했어요.'),fb)}catch(_){fb()}break}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='selv'){S.sel=t.value;render()}
  if(t.id==='mem'){S.member=!t.checked;render()}
  if(t.id==='tcat'||t.id==='mycat'){S.myCat=t.value;render()}
  if(t.id==='tlen'){S.toolLen=t.value;render()}
  if(t.id==='tmine'){S.trendMine=t.checked;render()}
  if(t.dataset.chk){S.checks[t.dataset.chk]=t.checked;render()}
  if(t.id==='ms'||t.id==='mv'){S.money={subs:+$('#ms').value||0,views:+$('#mv').value||0};render()}
});
render();
</script>

</body></html>
